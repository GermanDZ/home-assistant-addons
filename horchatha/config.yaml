name: HorchatHA
version: 0.1.0
slug: horchatha
description: Bring a cloud video intercom into Home Assistant (rings, live video, photos, doors)
url: https://github.com/GermanDZ/home-assistant-addons/tree/main/horchatha
arch:
  - aarch64
  - amd64
image: ghcr.io/germandz/{arch}-horchatha
stage: experimental
startup: services
boot: auto
services:
  - mqtt:need
ingress: true
ingress_port: 8099
panel_icon: mdi:doorbell-video
panel_title: Intercom
map:
  - media:rw
backup: hot
watchdog: http://[HOST]:[PORT:8080]/health
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Door-open API for the LAN (bearer token). Off unless you map it.
options:
  oauth_base: null
  api_base: null
  oauth_client_id: null
  oauth_client_secret: null
  oauth_redirect_uri: null
  push_sender_id: null
  push_app_id: null
  push_api_key: null
  push_project_id: null
  app_package: null
  app_version: null
  app_build: null
  account_username: null
  accept_language: es-ES
  door_entity: button
  live_video: false
  go2rtc_rtsp_url: rtsp://172.30.32.1:8554
  archive_days: 30
  dry_run: false
  log_level: INFO
schema:
  # Provider: the endpoints and app credentials of your provider's mobile app.
  oauth_base: url
  api_base: url
  signaling_base: url?
  signaling_domain: str?
  oauth_client_id: password
  oauth_client_secret: password
  oauth_redirect_uri: str
  push_sender_id: str
  push_app_id: str
  push_api_key: password
  push_project_id: str
  app_package: str
  app_version: str
  app_build: str
  accept_language: str?
  app_os: str?
  app_os_version: str?
  # Account
  account_username: email
  account_password: password?
  # MQTT: empty uses the Mosquitto app's details from the Supervisor.
  mqtt_host: str?
  mqtt_port: port?
  mqtt_tls: bool?
  mqtt_user: str?
  mqtt_password: password?
  # Doors and people
  door_names: str?
  opener_names: str?
  door_entity: list(button|lock)
  history_interval_default: int(1,60)?
  # Live video (into go2rtc)
  live_video: bool
  live_video_default: bool?
  preview_default: bool?
  preview_doors: str?
  go2rtc_rtsp_url: str?
  go2rtc_rtsp_user: str?
  go2rtc_rtsp_password: password?
  # Photos and ops
  archive_days: int(1,365)
  photo_match_window: float(1,3600)?
  ack_mode: list(none|received|attended)?
  bridge_api_token: password?
  dry_run: bool
  log_level: list(DEBUG|INFO|WARNING|ERROR)
